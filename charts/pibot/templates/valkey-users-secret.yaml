{{- if and .Values.valkey.enabled .Values.valkey.auth.enabled -}}
{{- $auth := include "pibot.valkey.authCredentials" . | fromJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pibot.valkey.authSecretName" . }}
  labels:
    app.kubernetes.io/name: pibot
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: valkey-auth
type: Opaque
stringData:
  default: {{ $auth.password | quote }}  # ACL username
  uri: {{ $auth.uri | quote }}
{{- end }}
