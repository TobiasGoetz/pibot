apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pibot.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: pibot
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: pibot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          envFrom:
            - secretRef:
                name: {{ required "secretRef.name is required (credentials Secret)" .Values.secretRef.name }}
          env:
            - name: PIBOT_LOG_LEVEL
              value: {{ .Values.pibot.logLevel | quote }}
            - name: PIBOT_COMMAND_SYNC_BEHAVIOR
              value: {{ .Values.pibot.commandSyncBehavior | quote }}
            - name: PIBOT_ENABLE_DEV_TOOLS
              value: {{ .Values.pibot.enableDevTools | quote }}
            {{- if .Values.valkey.enabled }}
            - name: PIBOT_VALKEY_URI
              value: {{ include "pibot.valkey.uri" . | quote }}
            {{- end }}
