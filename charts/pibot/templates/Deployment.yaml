apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pibot.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pibot
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: pibot
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: pibot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          envFrom:
            - secretRef:
                name: {{ required "secretRef.name is required (credentials Secret)" .Values.secretRef.name }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: COMMAND_SYNC_BEHAVIOR
              value: {{ .Values.bot.settings.commandSyncBehavior | quote }}
            - name: ENABLE_DEV_TOOLS
              value: {{ .Values.bot.settings.enableDevTools | quote }}
