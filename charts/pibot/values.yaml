image:
  repository: ghcr.io/tobiasgoetz/pibot
  tag: ""

# Required. Expected keys: PIBOT_DISCORD_TOKEN, PIBOT_MONGODB_URI,
# PIBOT_SUMMARIZE_CLOUDFLARE_BASE_URL, PIBOT_SUMMARIZE_CLOUDFLARE_TOKEN,
# PIBOT_TRANSLATIONS_DEEPL_API_KEY.
# PIBOT_VALKEY_URI only when valkey.enabled is false.
secretRef:
  name: ""

pibot:
  logLevel: INFO
  commandSyncBehavior: global
  enableDevTools: false

# Upstream subchart: https://github.com/valkey-io/valkey-helm
valkey:
  enabled: true
  auth:
    enabled: true
    # Must match pibot.valkey.authSecretName.
    usersExistingSecret: '{{ printf "%s-valkey-users" .Release.Name | trunc 63 | trimSuffix "-" }}'
    aclUsers:
      default:
        permissions: "~* &* +@all"
  dataStorage:
    enabled: false
  service:
    port: 6379
