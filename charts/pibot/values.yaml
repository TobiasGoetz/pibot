image:
  repository: ghcr.io/tobiasgoetz/pibot
  tag: ""

# Existing Secret with credentials (ExternalSecret / etc.). Required.
# Expected keys:
#   PIBOT_DISCORD_TOKEN
#   PIBOT_MONGODB_URI
#   PIBOT_SUMMARIZE_CLOUDFLARE_BASE_URL
#   PIBOT_SUMMARIZE_CLOUDFLARE_TOKEN
#   PIBOT_TRANSLATIONS_DEEPL_API_KEY
#   PIBOT_VALKEY_URI (omit by default; chart injects an authenticated URI. Required when valkey.enabled is false)
secretRef:
  name: ""

# Non-secret config (plain env on the Deployment).
pibot:
  logLevel: INFO
  commandSyncBehavior: global
  enableDevTools: false

# In-cluster Valkey (upstream subchart). Enabled by default.
# Creates a random-password Secret, enables Valkey ACL auth, and injects
# PIBOT_VALKEY_URI (with credentials) on the Deployment.
# Set enabled: false and provide PIBOT_VALKEY_URI in secretRef for external Valkey.
# Full options: https://github.com/valkey-io/valkey-helm
valkey:
  enabled: true
  auth:
    enabled: true
    # Templated by the Valkey subchart; must match pibot.valkey.authSecretName.
    usersExistingSecret: '{{ printf "%s-valkey-users" .Release.Name | trunc 63 | trimSuffix "-" }}'
    aclUsers:
      default:
        permissions: "~* &* +@all"
  dataStorage:
    enabled: true
    requestedSize: 1Gi
  service:
    port: 6379
